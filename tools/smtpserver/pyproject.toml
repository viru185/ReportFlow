[project]
name = "reportflow-smtpserver"
version = "0.1.0"
description = "Local SMTP capture for testing ReportFlow on a developer laptop."
requires-python = ">=3.11"
dependencies = ["aiosmtpd"]

[project.scripts]
smtpserver = "reportflow_smtpserver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reportflow_smtpserver"]

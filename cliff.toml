# git-cliff configuration — changelog from Conventional Commits.

[changelog]
header = "# Changelog\n\nAll notable changes to ReportFlow are documented here.\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}{% if commit.breaking %} **(breaking)**{% endif %}
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
# Beta pre-releases (vX.Y.Z-beta) are not changelog versions of their own: their commits
# roll into the next stable release, so its notes cover everything since the last stable.
ignore_tags = "-(alpha|beta|rc)"
sort_commits = "oldest"

commit_parsers = [
  # The release workflow's own CHANGELOG commit is not a change worth listing.
  { message = "^docs: update CHANGELOG.md", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "Build" },
  { message = "^chore", group = "Chores" },
  { message = ".*", group = "Other" },
]
